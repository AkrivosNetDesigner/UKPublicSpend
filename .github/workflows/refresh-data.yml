name: Refresh data

# Once a month (and on demand from the Actions tab) this downloads the latest official files, rebuilds site/data and
# opens a pull request with the result. Nothing is published until the pull request is merged and the site redeployed.
on:
  schedule:
    - cron: "17 5 6 * *"        # 06:17 UTC on the 6th of each month, after the monthly ONS, HMRC and NHS England releases
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install openpyxl xlrd
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Check the code
        run: python -I -m unittest discover -s pipeline/tests

      - name: Build the data
        run: |
          python -I pipeline/build.py

      - name: Open a pull request with the new data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- site/data; then
            echo "No change in site/data."
            exit 0
          fi
          branch="data-refresh/$(date -u +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add site/data
          git commit -m "Monthly data refresh $(date -u +%Y-%m-%d)"
          git push --force origin "$branch"
          if gh pr view "$branch" >/dev/null 2>&1; then
            echo "Pull request already open; branch updated."
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
              --title "Monthly data refresh $(date -u +%Y-%m)" \
              --body "Automatic rebuild of site/data from the latest official files (see pipeline/sources.json).

          Please look at the Data checks page and the changes in Unusual figures before merging; then redeploy the site.

          Not refreshed automatically (new file each year, update pipeline/sources.json by hand): Treasury Public Spending Statistics (July), HMRC tax gap (June), DWP fraud and error (May), English indices of deprivation, ONS population estimates."
          fi
